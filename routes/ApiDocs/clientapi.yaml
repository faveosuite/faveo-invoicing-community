openapi: 3.0.0
info:
  title: Client API
  version: 1.0.0
servers:
  - url: /
paths:
  /login:
    get:
      summary: Show login form
      operationId: showLoginForm
      tags:
        - Authentication
      responses:
        '200':
          description: Login page data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      status:
                        type: object
                        properties:
                          msg91_status:
                            type: integer
                          emailverification_status:
                            type: integer
                          terms:
                            type: integer
                      apiKeys:
                        type: object
                        properties:
                          nocaptcha_sitekey:
                            type: string
                          captcha_secretCheck:
                            type: string
                          msg91_auth_key:
                            type: string
                          terms_url:
                            type: string
                      analyticsTag:
                        type: string
                      location:
                        type: object
                      google_status:
                        type: integer
                      github_status:
                        type: integer
                      twitter_status:
                        type: integer
                      linkedin_status:
                        type: integer
    post:
      summary: User login
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email_username
                - password
              properties:
                email_username:
                  type: string
                  description: User's email or username
                password:
                  type: string
                  format: password
                remember:
                  type: boolean
      responses:
        '200':
          description: Authentication successful, redirecting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect:
                    type: string
                    example: /client-dashboard
        '422':
          description: Invalid credentials.
        '500':
          description: Internal server error.
  /register:
    post:
      summary: User registration
      operationId: postRegister
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
                - password
                - company
                - address
                - mobile
                - mobile_code
                - country
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                company:
                  type: string
                address:
                  type: string
                mobile:
                  type: string
                mobile_code:
                  type: string
                country:
                  type: string
      responses:
        '200':
          description: Registration complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  need_verify:
                    type: integer
                    example: 1
  /logout:
    get:
      summary: User logout
      operationId: logout
      tags:
        - Authentication
      responses:
        '200':
          description: LogOut.
  /password/email:
    post:
      summary: Send password reset link
      operationId: sendResetLinkEmail
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset link sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /password/reset:
    get:
      summary: Show password reset form
      operationId: showResetForm
      tags:
        - Authentication
      responses:
        '200':
          description: Forgot password page data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      status:
                        type: object
                        properties:
                          msg91_status:
                            type: integer
                          emailverification_status:
                            type: integer
                          terms:
                            type: integer
                      apiKeys:
                        type: object
                        properties:
                          nocaptcha_sitekey:
                            type: string
                          captcha_secretCheck:
                            type: string
                          msg91_auth_key:
                            type: string
                          terms_url:
                            type: string
    post:
      summary: Reset password
      operationId: resetPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - email
                - password
                - password_confirmation
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password has been reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  redirect:
                    type: string
  /password/reset/{token}:
    get:
      summary: Show password reset form
      operationId: showResetFormWithToken
      tags:
        - Authentication
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Password reset page data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        reset_token:
                          type: string
                        email:
                          type: string
                          format: email
  /2fa/session-check:
    get:
      summary: Check 2FA session
      operationId: verifySession
      tags:
        - 2FA
      responses:
        '200':
          description: Session is active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: active
  /recovery-code:
    get:
      summary: Show recovery code
      operationId: showRecoveryCode
      tags:
        - 2FA
      responses:
        '200':
          description: Redirect to recovery code page.
  /verify-2fa:
    get:
      summary: Verify 2FA page
      operationId: verify2fa
      tags:
        - 2FA
      responses:
        '200':
          description: Redirect to 2FA verification page.
  /2fa/loginValidate:
    post:
      summary: Validate 2FA token
      operationId: postLoginValidateToken
      tags:
        - 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - totp
              properties:
                totp:
                  type: string
      responses:
        '200':
          description: 2FA token is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: User role is sent.
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          role:
                            type: string
  /verify-recovery-code:
    post:
      summary: Verify recovery code
      operationId: verifyRecoveryCode
      tags:
        - 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rec_code
              properties:
                rec_code:
                  type: string
      responses:
        '200':
          description: Recovery code is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: User role is sent.
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          role:
                            type: string
  /2fa/enable:
    post:
      summary: Enable 2FA
      operationId: enableTwoFactor
      tags:
        - 2FA
      responses:
        '200':
          description: 2FA enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  image:
                    type: string
                  secret:
                    type: string
  /2fa/disable/{userId}:
    post:
      summary: Disable 2FA
      operationId: disableTwoFactor
      tags:
        - 2FA
      parameters:
        - name: userId
          in: path
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 2FA disabled.
  /2fa/setupValidate:
    post:
      summary: Validate 2FA setup
      operationId: postSetupValidateToken
      tags:
        - 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - totp
              properties:
                totp:
                  type: string
      responses:
        '200':
          description: 2FA setup validated.
  /verify-password:
    get:
      summary: Verify password
      operationId: verifyPassword
      tags:
        - 2FA
      parameters:
        - name: user_password
          in: query
          required: true
          schema:
            type: string
            format: password
        - name: login_type
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Password verified.
  /2fa-recovery-code:
    post:
      summary: Generate recovery code
      operationId: generateRecoveryCode
      tags:
        - 2FA
      responses:
        '200':
          description: Recovery code generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
  /get-recovery-code:
    get:
      summary: Get recovery code
      operationId: getRecoveryCode
      tags:
        - 2FA
      responses:
        '200':
          description: Recovery code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
  /verify-2fa-admin:
    post:
      summary: Verify 2FA for admin
      operationId: postSetupValidateTokenAdmin
      tags:
        - 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - totp
              properties:
                totp:
                  type: string
      responses:
        '200':
          description: 2FA setup validated.
  /get-loginstate/{state}:
    get:
      summary: Get states by country
      operationId: getState
      tags:
        - General
      parameters:
        - name: state
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of states.
          content:
            application/json:
              schema:
                type: object
  /get-countries:
    get:
      summary: Get all countries
      operationId: getCountries
      tags:
        - General
      responses:
        '200':
          description: List of countries.
          content:
            application/json:
              schema:
                type: object
  /get-code:
    get:
      summary: Get phone code by country
      operationId: getCode
      tags:
        - General
      parameters:
        - name: country_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Phone code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
  /get-currency:
    get:
      summary: Get currency by country
      operationId: getCurrency
      tags:
        - General
      parameters:
        - name: country_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Currency code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Currency:
                    type: string
  /client-dashboard-details:
    get:
      summary: Get client dashboard details
      operationId: clientDetails
      tags:
        - Dashboard
      responses:
        '200':
          description: Client dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      pendingInvoicesCount:
                        type: integer
                      ordersCount:
                        type: integer
                      renewalCount:
                        type: integer
                      user:
                        $ref: '#/components/schemas/User'
                      status:
                        type: string
                      updated_ends_at:
                        type: string
  /master-data:
    get:
      summary: Get master data
      operationId: masterData
      tags:
        - Master Data
      responses:
        '200':
          description: Master data for the application.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataCenters:
                    type: array
                    items:
                      type: object
                  setting:
                    type: object
                  cloudSubDomain:
                    type: string
                  flagClass:
                    type: string
                  cloudPopUpDetails:
                    type: object
                  status:
                    type: object
                  cart:
                    type: object
                  Demo_page_status:
                    type: integer
                  scripts:
                    type: array
                    items:
                      type: object
                  pages:
                    type: array
                    items:
                      type: object
                  apiKeys:
                    type: object
                  social:
                    type: array
                    items:
                      type: object
                  productGroup:
                    type: object
  /demo-request:
    post:
      summary: Request a demo
      operationId: postDemoReq
      tags:
        - Master Data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - demoname
                - demoemail
                - demomessage
                - country_code
                - Mobile
                - product
              properties:
                demoname:
                  type: string
                demoemail:
                  type: string
                  format: email
                demomessage:
                  type: string
                country_code:
                  type: string
                Mobile:
                  type: string
                product:
                  type: string
      responses:
        '200':
          description: Demo request sent.
  /language/control:
    get:
      summary: Get language dropdown
      operationId: fetchLangDropdownUsers
      tags:
        - Master Data
      responses:
        '200':
          description: List of languages.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /trial-cloud-products:
    post:
      summary: Get trial cloud products
      operationId: trialCloudProducts
      tags:
        - Master Data
      responses:
        '200':
          description: List of trial cloud products.
          content:
            application/json:
              schema:
                type: object
  /create/tenant/purchase:
    post:
      summary: Create tenant purchase
      operationId: storeTenantTillPurchase
      tags:
        - Master Data
      responses:
        '302':
          description: Redirect to cart.
  /available-groups:
    post:
      summary: Get available groups
      operationId: getAvailableGroups
      tags:
        - Master Data
      responses:
        '200':
          description: List of available groups.
          content:
            application/json:
              schema:
                type: object
  /mail-chimp/subcribe:
    post:
      summary: Subscribe to Mailchimp
      operationId: addSubscriberByClientPanel
      tags:
        - Master Data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newsletterEmail
              properties:
                newsletterEmail:
                  type: string
                  format: email
      responses:
        '200':
          description: Subscribed to Mailchimp.
  /first-login:
    post:
      summary: First login attempt
      operationId: firstLoginAttempt
      tags:
        - Master Data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - product
                - domain
              properties:
                id:
                  type: integer
                product:
                  type: string
                domain:
                  type: string
      responses:
        '200':
          description: First login attempt successful.
  /store-basic-details:
    post:
      summary: Store basic details
      operationId: storeBasicDetailsss
      tags:
        - Master Data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - company
                - address
              properties:
                company:
                  type: string
                address:
                  type: string
      responses:
        '302':
          description: Redirect back.
  /my-invoices:
    get:
      summary: Get my invoices
      operationId: invoices
      tags:
        - Invoices
      responses:
        '200':
          description: List of invoices.
          content:
            application/json:
              schema:
                type: object
  /my-invoice/{id}:
    get:
      summary: Get my invoice
      operationId: getInvoice
      tags:
        - Invoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invoice details.
          content:
            application/json:
              schema:
                type: object
  /get-my-invoices:
    get:
      summary: Get a paginated list of the authenticated user's invoices
      operationId: getInvoices
      tags:
        - Invoices
      parameters:
        - name: search-query
          in: query
          description: A string to search across multiple fields.
          schema:
            type: string
        - name: sort-order
          in: query
          description: The order to sort the results by.
          schema:
            type: string
            enum: [asc, desc]
        - name: sort-field
          in: query
          description: The field to sort the results by.
          schema:
            type: string
        - name: limit
          in: query
          description: The number of results to return per page.
          schema:
            type: integer
        - name: status
          in: query
          description: Filter invoices by status.
          schema:
            type: string
            enum: [pending, success, partially paid]
      responses:
        '200':
          description: A paginated list of invoices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        number:
                          type: string
                          description: The invoice number, potentially with a 'renewed' badge.
                        OrderNo:
                          type: string
                          description: The associated order number(s).
                        date:
                          type: string
                          description: The invoice date.
                        total:
                          type: string
                          description: The formatted total amount of the invoice.
                        paid:
                          type: string
                          description: The formatted amount paid on the invoice.
                        balance:
                          type: string
                          description: The formatted remaining balance of the invoice.
                        status:
                          type: string
                          description: The status of the invoice.
                        action:
                          type: string
                          description: HTML for action buttons (view, pay, delete).
  /invoices/delete/{id}:
    delete:
      summary: Delete invoice
      operationId: invoiceDelete
      tags:
        - Invoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invoice deleted.
  /paynow/{id}:
    get:
      summary: Pay now
      operationId: payNow
      tags:
        - Invoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pay now page.
          content:
            application/json:
              schema:
                type: object
  /my-orders:
    get:
      summary: Get my orders
      operationId: orders
      tags:
        - Orders
      responses:
        '200':
          description: List of orders.
          content:
            application/json:
              schema:
                type: object
  /get-my-orders:
    get:
      summary: Get my orders
      operationId: getClientOrderVue
      tags:
        - Orders
      responses:
        '200':
          description: List of orders.
          content:
            application/json:
              schema:
                type: object
  /my-order/{id}:
    get:
      summary: Get my order
      operationId: getOrder
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema:
                type: object
  /renew-popup-details/{productid}:
    get:
      summary: Get renew popup details
      operationId: renewPopupVue
      tags:
        - Orders
      parameters:
        - name: productid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Renew popup details.
          content:
            application/json:
              schema:
                type: object
  /get-my-payment-client/{orderid}/{userid}:
    get:
      summary: Get my payment client
      operationId: getPaymentByOrderIdClient
      tags:
        - Orders
      parameters:
        - name: orderid
          in: path
          required: true
          schema:
            type: integer
        - name: userid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of payments.
          content:
            application/json:
              schema:
                type: object
  /get-versions/{productid}/{clientid}/{invoiceid}:
    get:
      summary: Get versions
      operationId: getVersionList
      tags:
        - Orders
      parameters:
        - name: productid
          in: path
          required: true
          schema:
            type: integer
        - name: clientid
          in: path
          required: true
          schema:
            type: integer
        - name: invoiceid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of versions.
          content:
            application/json:
              schema:
                type: object
  /get-github-versions/{productid}/{clientid}/{invoiceid}:
    get:
      summary: Get github versions
      operationId: getGithubVersionList
      tags:
        - Orders
      parameters:
        - name: productid
          in: path
          required: true
          schema:
            type: integer
        - name: clientid
          in: path
          required: true
          schema:
            type: integer
        - name: invoiceid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of github versions.
          content:
            application/json:
              schema:
                type: object
  /my-profile:
    get:
      summary: Get my profile
      operationId: profile
      tags:
        - Profile
      responses:
        '200':
          description: User profile data.
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Update my profile
      operationId: postProfile
      tags:
        - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                company:
                  type: string
                mobile_code:
                  type: string
                mobile:
                  type: string
                address:
                  type: string
                town:
                  type: string
                timezone_id:
                  type: integer
                state:
                  type: string
                zip:
                  type: string
      responses:
        '200':
          description: Profile updated successfully.
  /my-password:
    patch:
      summary: Update my password
      operationId: postPassword
      tags:
        - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password updated successfully.
  /renew/{id}/{agents}:
    get:
      summary: Show the renewal form
      operationId: renewForm
      tags:
        - Renewal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: agents
          in: path
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: The renewal form data.
          content:
            application/json:
              schema:
                type: object
  /renew/{id}:
    post:
      summary: Renew a subscription (Admin)
      operationId: renew
      tags:
        - Renewal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: integer
                payment_method:
                  type: string
                cost:
                  type: number
                code:
                  type: string
                agents:
                  type: integer
      responses:
        '200':
          description: The subscription has been renewed.
  /client/renew/{id}:
    post:
      summary: Renew a subscription (Client)
      operationId: renewByClient
      tags:
        - Renewal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: integer
                user:
                  type: integer
                code:
                  type: string
                agents:
                  type: integer
      responses:
        '200':
          description: The subscription has been renewed and will redirect to the payment page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirectTo:
                    type: string
  /autopaynow/{id}:
    get:
      summary: Auto-renew a subscription
      operationId: autoRenewbyid
      tags:
        - Renewal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '302':
          description: Redirect to the payment page.
  /cart-access:
    get:
      summary: Access cart information
      operationId: cartAccess
      tags:
        - Cart
      parameters:
        - name: method
          in: query
          required: true
          schema:
            type: string
            enum:
              - clear
              - getContent
              - getTotal
              - isEmpty
              - getTotalQuantity
      responses:
        '200':
          description: The result of the cart operation.
          content:
            application/json:
              schema:
                type: object
  /cart/remove:
    post:
      summary: Remove an item from the cart
      operationId: cartRemove
      tags:
        - Cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
      responses:
        '200':
          description: The item has been removed from the cart.
  /strRenewal-enable:
    post:
      summary: Enable Stripe Auto-renewal
      operationId: enableAutorenewalStatus
      tags:
        - Renewal Status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
              properties:
                order_id:
                  type: integer
                  description: The ID of the order to enable auto-renewal for.
      responses:
        '200':
          description: Success message or a redirect URL for payment confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: success
                  message:
                    type: string
                  redirectUrl:
                    type: string
                    format: uri
        '500':
          description: Error enabling auto-renewal.
  /renewal-disable:
    post:
      summary: Disable Auto-renewal
      operationId: disableAutorenewalStatus
      tags:
        - Renewal Status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
              properties:
                order_id:
                  type: integer
      responses:
        '200':
          description: Auto-renewal disabled successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: success
                  message:
                    type: string
        '500':
          description: Error disabling auto-renewal.
  /rzpRenewal-disable/{orderid}:
    post:
      summary: Enable Razorpay Auto-renewal
      operationId: enableRzpStatus
      tags:
        - Renewal Status
      parameters:
        - name: orderid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - razorpay_payment_id
              properties:
                razorpay_payment_id:
                  type: string
      responses:
        '302':
          description: Redirects back with a success or failure message.
  /payment/{invoice}:
    post:
      summary: Process a Razorpay payment
      operationId: payment
      tags:
        - Payment
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - razorpay_payment_id
              properties:
                razorpay_payment_id:
                  type: string
      responses:
        '302':
          description: Redirect to checkout with a success or failure message.
  /stripe:
    post:
      summary: Process a Stripe payment
      operationId: postPaymentWithStripe
      tags:
        - Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stripeToken
              properties:
                stripeToken:
                  type: string
      responses:
        '200':
          description: Payment successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '302':
          description: Redirect to a URL for further action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirectUrl:
                    type: string
                    format: uri
  /url-save:
    post:
      summary: Save a URL to the session
      operationId: urlSave
      tags:
        - Whatsapp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: URL saved successfully.
  /save-waba-id:
    post:
      summary: Save a WABA ID
      operationId: saveWabaId
      tags:
        - Whatsapp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - waba_id
                - phone_number_id
                - business_id
                - code
                - order_id
              properties:
                waba_id:
                  type: string
                phone_number_id:
                  type: string
                business_id:
                  type: string
                code:
                  type: string
                order_id:
                  type: integer
      responses:
        '200':
          description: WABA ID saved successfully.
  /webhook-url-edit:
    post:
      summary: Edit a webhook URL
      operationId: webhookUrlEdit
      tags:
        - Whatsapp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - id
              properties:
                url:
                  type: string
                  format: uri
                id:
                  type: integer
      responses:
        '200':
          description: Webhook URL updated successfully.
        '403':
          description: Unauthorized.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        mobile:
          type: string
        country:
          type: string
        created_at:
          type: string
          format: date-time
